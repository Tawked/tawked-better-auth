# CI for @tawked/better-auth.
# Runs the checks that need nothing outside this repository, with @tawked/sdk from npm: install,
# type-check, the build, the built types as an application sees them, and the pack. The full test
# suite (a real Better Auth signing people in against a local stand-in for the API) runs before
# every release.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
        better-auth: ['1.7.7', 'latest']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # The committed lock links @tawked/sdk to Tawked's monorepo: here it comes from npm. Peers are
      # resolved the legacy way: npm 10 on Node 20 crashes on this dev tree's peer set otherwise.
      - run: rm -f package-lock.json && npm install --no-audit --no-fund --legacy-peer-deps
      - if: matrix.better-auth != '1.7.7'
        run: npm install --no-save --no-audit --no-fund --legacy-peer-deps better-auth@${{ matrix.better-auth }}
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npm run typecheck:dist
      - run: npm pack --dry-run
